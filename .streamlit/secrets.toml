# === Optional: Server & LLM Settings ===
# Use SETTINGS_STORE_TYPE = 'server' to persist app settings centrally to the Flask settings server
# Set SETTINGS_STORE_TYPE to 'local' for filesystem-backed settings (default in AppConfig)
SETTINGS_STORE_TYPE = "local"
# Settings server endpoint and optional API key for server-backed settings and server-side LLM scoring
SETTINGS_SERVER_URL = "http://localhost:5001"
SETTINGS_SERVER_API_KEY = "dev-secret-key" # Optional: set to protect the settings server endpoints
# LLM scoring mode: 'auto' | 'local' | 'server' | 'server-queue'
#  - 'auto': uses local VADER/TextBlob and falls back to LLM if configured
#  - 'server': calls the settings server's /score endpoint for scoring
#  - 'server-queue': posts to /score/submit and polls /score/poll/<job_id>
LLM_SCORING_MODE = "auto"

